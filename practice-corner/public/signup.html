<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — Practice Corner</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="paper-overlay" aria-hidden="true"></div>

  <!-- Header -->
  <header class="site-header">
    <div class="container header-content">
      <a href="/" class="logo-area">
        <span class="logo-title">Practice Corner</span>
        <span class="logo-tag">Student Edition</span>
      </a>
      <div id="user-nav-container" class="user-nav">
        <a href="/login" class="btn btn-secondary" style="font-size: 19px; padding: 6px 18px;">Sign in</a>
      </div>
    </div>
  </header>

  <main class="container narrow-container">
    <div class="paper-card" style="transform: rotate(-0.8deg);">
      <div class="tape" aria-hidden="true"></div>

      <div style="text-align: center; margin-bottom: 28px;">
        <h1 style="font-family: var(--font-hand); font-size: 38px; line-height: 1.1; margin-bottom: 6px;">
          Create your Student Notebook
        </h1>
        <p style="color: var(--ink-muted); font-size: 16px;">
          Join Practice Corner to save your practice sessions and review answer keys.
        </p>
      </div>

      <!-- General alert box -->
      <div id="alert-box" class="alert-box" role="alert"></div>

      <!-- Sign Up Form -->
      <form id="signup-form" novalidate>
        <!-- Full Name -->
        <div class="form-group">
          <label for="name" class="form-label">Full Name</label>
          <input
            type="text"
            id="name"
            name="name"
            class="form-input"
            placeholder="e.g. Rahul Sharma"
            required
            autocomplete="name"
          >
          <div id="name-error" class="form-error"></div>
        </div>

        <!-- Mobile Number (10 digits) -->
        <div class="form-group">
          <label for="mobile" class="form-label">Mobile Number (10 digits)</label>
          <input
            type="tel"
            id="mobile"
            name="mobile"
            class="form-input"
            placeholder="e.g. 9876543210"
            maxlength="10"
            required
            autocomplete="tel"
          >
          <div id="mobile-error" class="form-error"></div>
        </div>

        <!-- Email -->
        <div class="form-group">
          <label for="email" class="form-label">Email Address</label>
          <input
            type="email"
            id="email"
            name="email"
            class="form-input"
            placeholder="student@example.com"
            required
            autocomplete="email"
          >
          <div id="email-error" class="form-error"></div>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label for="password" class="form-label">Password (at least 6 characters)</label>
          <input
            type="password"
            id="password"
            name="password"
            class="form-input"
            placeholder="Choose a safe password"
            required
            autocomplete="new-password"
          >
          <div id="password-error" class="form-error"></div>
        </div>

        <!-- Confirm Password -->
        <div class="form-group">
          <label for="confirm-password" class="form-label">Confirm Password</label>
          <input
            type="password"
            id="confirm-password"
            name="confirmPassword"
            class="form-input"
            placeholder="Retype your password"
            required
            autocomplete="new-password"
          >
          <div id="confirmPassword-error" class="form-error"></div>
        </div>

        <!-- Submit Button -->
        <div style="margin-top: 30px;">
          <button type="submit" id="submit-btn" class="btn btn-primary" style="width: 100%; font-size: 24px; padding: 12px;">
            Sign Up &rarr;
          </button>
        </div>
      </form>

      <!-- Bottom link -->
      <div style="text-align: center; margin-top: 24px; font-size: 16px; border-top: 2px dashed rgba(59, 47, 47, 0.2); padding-top: 18px;">
        Already have an account? <a href="/login" style="color: var(--c-english); font-weight: bold; text-decoration: underline;">Sign in here</a>
      </div>
    </div>
  </main>

  <script src="/js/auth-nav.js"></script>
  <script src="/js/signup.js"></script>
</body>
</html>
