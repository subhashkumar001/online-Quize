<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — Practice Corner</title>
  <link rel="stylesheet" href="/css/style.css">
  <script>
    (function(){
      var s=localStorage.getItem('theme');
      if(s==='dark'||(!s&&window.matchMedia('(prefers-color-scheme: dark)').matches)){
        document.documentElement.setAttribute('data-theme','dark');
      }
    })();
  </script>
</head>
<body>
  <!-- Header -->
  <header class="site-header">
    <div class="container header-content">
      <a href="/" class="logo-area">
        <span class="logo-title">Practice Corner</span>
        <span class="logo-tag">Student Edition</span>
      </a>
      <div id="user-nav-container" class="user-nav">
        <a href="/login" class="btn btn-secondary">Sign In</a>
      </div>
    </div>
  </header>

  <main class="container narrow-container">
    <div class="card" style="padding: 32px 28px;">
      <h1 style="text-align: center; margin-bottom: 6px;">Create Account</h1>
      <p style="text-align: center; margin-bottom: 24px;">
        Register to practice quizzes and track your test results.
      </p>

      <div id="alert-box" class="alert-box" role="alert"></div>

      <form id="signup-form" novalidate>
        <div class="form-group">
          <label for="name" class="form-label">Full Name</label>
          <input
            type="text"
            id="name"
            name="name"
            class="form-input"
            placeholder="e.g. Rahul Sharma"
            required
            autocomplete="name"
          >
          <div id="name-error" class="form-error"></div>
        </div>

        <div class="form-group">
          <label for="mobile" class="form-label">Mobile Number (10 digits)</label>
          <input
            type="tel"
            id="mobile"
            name="mobile"
            class="form-input"
            placeholder="e.g. 9876543210"
            maxlength="10"
            required
            autocomplete="tel"
          >
          <div id="mobile-error" class="form-error"></div>
        </div>

        <div class="form-group">
          <label for="email" class="form-label">Email Address</label>
          <input
            type="email"
            id="email"
            name="email"
            class="form-input"
            placeholder="student@example.com"
            required
            autocomplete="email"
          >
          <div id="email-error" class="form-error"></div>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password (at least 6 characters)</label>
          <input
            type="password"
            id="password"
            name="password"
            class="form-input"
            placeholder="Choose a password"
            required
            autocomplete="new-password"
          >
          <div id="password-error" class="form-error"></div>
        </div>

        <div class="form-group">
          <label for="confirm-password" class="form-label">Confirm Password</label>
          <input
            type="password"
            id="confirm-password"
            name="confirmPassword"
            class="form-input"
            placeholder="Confirm your password"
            required
            autocomplete="new-password"
          >
          <div id="confirmPassword-error" class="form-error"></div>
        </div>

        <div style="margin-top: 24px;">
          <button type="submit" id="submit-btn" class="btn btn-primary btn-block" style="padding: 11px;">
            Sign Up &rarr;
          </button>
        </div>
      </form>

      <div style="text-align: center; margin-top: 20px; font-size: 14px; color: var(--text-muted); border-top: 1px solid var(--border-color); padding-top: 16px;">
        Already have an account? <a href="/login" style="color: var(--primary); font-weight: 600;">Sign in here</a>
      </div>
    </div>
  </main>

  <footer>
    Practice Corner &middot; Student Quiz Portal &middot; 2026
  </footer>

  <script src="/js/auth-nav.js"></script>
  <script src="/js/signup.js"></script>
</body>
</html>
