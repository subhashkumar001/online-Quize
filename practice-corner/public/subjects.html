<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choose a Subject — Practice Corner</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- Header -->
  <header class="site-header">
    <div class="container header-content">
      <a href="/subjects" class="logo-area">
        <span class="logo-title">Practice Corner</span>
        <span class="logo-tag">Dashboard</span>
      </a>
      <div id="user-nav-container" class="user-nav">
        <!-- Rendered by auth-nav.js -->
      </div>
    </div>
  </header>

  <main class="container">
    <div style="margin-bottom: 24px;">
      <h1>Choose a Subject</h1>
      <p>Select any subject below to begin your 10-question practice test.</p>
    </div>

    <!-- Subjects Grid -->
    <div id="subjects-container" class="subjects-grid">
      <div class="card" style="grid-column: 1/-1; text-align: center; color: #64748b; padding: 32px;">
        Loading subjects...
      </div>
    </div>

    <!-- Recent Attempts Section -->
    <section class="attempts-section">
      <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px;">
        <h2>Recent Practice History</h2>
        <span style="font-size: 13px; color: #64748b;">Last 5 attempts</span>
      </div>

      <div id="attempts-container" class="attempts-list">
        <div style="text-align: center; color: #64748b; padding: 16px;">
          Checking your study history...
        </div>
      </div>
    </section>
  </main>

  <footer>
    Practice Corner &middot; Student Quiz Portal &middot; 2026
  </footer>

  <script src="/js/auth-nav.js"></script>
  <script src="/js/subjects.js"></script>
</body>
</html>
