<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Session — Practice Corner</title>
  <link rel="stylesheet" href="/css/style.css">
  <script>
    (function(){
      var s=localStorage.getItem('theme');
      if(s==='dark'||(!s&&window.matchMedia('(prefers-color-scheme: dark)').matches)){
        document.documentElement.setAttribute('data-theme','dark');
      }
    })();
  </script>
</head>
<body>
  <!-- Header -->
  <header class="site-header">
    <div class="container header-content">
      <a href="/subjects" class="logo-area">
        <span class="logo-title">Practice Corner</span>
        <span class="logo-tag">Quiz</span>
      </a>
      <div id="user-nav-container" class="user-nav">
        <!-- Rendered by auth-nav.js -->
      </div>
    </div>
  </header>

  <main class="container narrow-container">
    <!-- Top bar -->
    <div class="quiz-header">
      <span id="subject-badge" class="subject-badge">
        Loading...
      </span>
      <span id="progress-indicator" class="progress-badge">
        Question 1 of 10
      </span>
    </div>

    <!-- Question Box -->
    <div class="question-card">
      <h2 id="question-text" class="question-text">
        Loading question...
      </h2>

      <!-- Options -->
      <div id="options-container" class="options-list">
        <!-- Injected by quiz.js -->
      </div>
    </div>

    <!-- Controls -->
    <div class="quiz-footer">
      <a href="/subjects" class="btn btn-secondary">
        &larr; Exit
      </a>
      <button type="button" id="next-btn" class="btn btn-primary" style="padding: 10px 24px;" disabled>
        Next Question &rarr;
      </button>
    </div>
  </main>

  <footer>
    Practice Corner &middot; Student Quiz Portal &middot; 2026
  </footer>

  <script src="/js/auth-nav.js"></script>
  <script src="/js/quiz.js"></script>
</body>
</html>
