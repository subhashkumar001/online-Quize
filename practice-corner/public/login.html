<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Practice Corner</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- Header -->
  <header class="site-header">
    <div class="container header-content">
      <a href="/" class="logo-area">
        <span class="logo-title">Practice Corner</span>
        <span class="logo-tag">Student Edition</span>
      </a>
      <div id="user-nav-container" class="user-nav">
        <a href="/signup" class="btn btn-secondary">Sign Up</a>
      </div>
    </div>
  </header>

  <main class="container narrow-container">
    <div class="card" style="padding: 32px 28px;">
      <h1 style="text-align: center; margin-bottom: 6px;">Sign In</h1>
      <p style="text-align: center; margin-bottom: 24px;">
        Sign in with your registered email or 10-digit mobile number.
      </p>

      <div id="alert-box" class="alert-box" role="alert"></div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="identifier" class="form-label">Email or Mobile Number</label>
          <input
            type="text"
            id="identifier"
            name="identifier"
            class="form-input"
            placeholder="student@example.com or 9876543210"
            required
            autocomplete="username"
          >
          <div id="identifier-error" class="form-error"></div>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            class="form-input"
            placeholder="Enter your password"
            required
            autocomplete="current-password"
          >
          <div id="password-error" class="form-error"></div>
        </div>

        <div style="margin-top: 24px;">
          <button type="submit" id="submit-btn" class="btn btn-primary btn-block" style="padding: 11px;">
            Sign In &rarr;
          </button>
        </div>
      </form>

      <div style="text-align: center; margin-top: 20px; font-size: 14px; color: #64748b; border-top: 1px solid #e2e8f0; padding-top: 16px;">
        Don't have an account? <a href="/signup" style="color: #2563eb; font-weight: 600;">Sign up here</a>
      </div>
    </div>
  </main>

  <footer>
    Practice Corner &middot; Student Quiz Portal &middot; 2026
  </footer>

  <script src="/js/auth-nav.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
