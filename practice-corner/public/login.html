<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Practice Corner</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="paper-overlay" aria-hidden="true"></div>

  <!-- Header -->
  <header class="site-header">
    <div class="container header-content">
      <a href="/" class="logo-area">
        <span class="logo-title">Practice Corner</span>
        <span class="logo-tag">Student Edition</span>
      </a>
      <div id="user-nav-container" class="user-nav">
        <a href="/signup" class="btn btn-secondary" style="font-size: 19px; padding: 6px 18px;">Sign up</a>
      </div>
    </div>
  </header>

  <main class="container narrow-container">
    <div class="paper-card" style="transform: rotate(0.6deg);">
      <div class="pin" aria-hidden="true"></div>

      <div style="text-align: center; margin-bottom: 28px;">
        <h1 style="font-family: var(--font-hand); font-size: 38px; line-height: 1.1; margin-bottom: 6px;">
          Welcome Back
        </h1>
        <p style="color: var(--ink-muted); font-size: 16px;">
          Sign in to your notebook with your registered email or 10-digit mobile number.
        </p>
      </div>

      <!-- General alert box for error -->
      <div id="alert-box" class="alert-box" role="alert"></div>

      <!-- Login Form -->
      <form id="login-form" novalidate>
        <!-- Email or Mobile -->
        <div class="form-group">
          <label for="identifier" class="form-label">Email or Mobile Number</label>
          <input
            type="text"
            id="identifier"
            name="identifier"
            class="form-input"
            placeholder="student@example.com or 9876543210"
            required
            autocomplete="username"
          >
          <div id="identifier-error" class="form-error"></div>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            class="form-input"
            placeholder="Enter your password"
            required
            autocomplete="current-password"
          >
          <div id="password-error" class="form-error"></div>
        </div>

        <!-- Submit Button -->
        <div style="margin-top: 30px;">
          <button type="submit" id="submit-btn" class="btn btn-primary" style="width: 100%; font-size: 24px; padding: 12px;">
            Sign In &rarr;
          </button>
        </div>
      </form>

      <!-- Bottom link -->
      <div style="text-align: center; margin-top: 24px; font-size: 16px; border-top: 2px dashed rgba(59, 47, 47, 0.2); padding-top: 18px;">
        Don't have an account yet? <a href="/signup" style="color: var(--c-english); font-weight: bold; text-decoration: underline;">Create one here</a>
      </div>
    </div>
  </main>

  <script src="/js/auth-nav.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
