<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Results — Practice Corner</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="paper-overlay" aria-hidden="true"></div>

  <!-- Header -->
  <header class="site-header">
    <div class="container header-content">
      <a href="/subjects" class="logo-area">
        <span class="logo-title">Practice Corner</span>
        <span class="logo-tag">Scorecard</span>
      </a>
      <div id="user-nav-container" class="user-nav">
        <!-- Rendered by auth-nav.js -->
      </div>
    </div>
  </header>

  <main class="container narrow-container" style="max-width: 720px;">
    <!-- Scorecard Summary -->
    <div class="score-badge-card" style="transform: rotate(-0.5deg);">
      <div class="tape" aria-hidden="true"></div>

      <span id="result-subject-tag" class="logo-tag" style="background: #ffffff; color: #000000; border: 1.5px solid #000000; font-size: 18px;">
        Subject
      </span>

      <h1 style="font-family: var(--font-hand); font-size: 34px; margin-top: 14px; margin-bottom: 0;">
        Practice Session Complete
      </h1>

      <!-- Giant Score display -->
      <div id="score-display" class="score-number">
        0 / 0
      </div>

      <p id="score-message" style="font-size: 19px; color: var(--ink-muted); margin-bottom: 6px;">
        Calculating your performance...
      </p>

      <!-- Correct & Wrong Pills -->
      <div class="score-stats">
        <div class="stat-pill correct">
          ✓ Correct: <strong id="correct-count">0</strong>
        </div>
        <div class="stat-pill wrong">
          ✗ Wrong: <strong id="wrong-count">0</strong>
        </div>
      </div>

      <!-- Action Buttons -->
      <div style="display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; margin-top: 32px;">
        <button type="button" id="try-again-btn" class="btn btn-primary" style="font-size: 22px; padding: 10px 28px;">
          Try Again &#8634;
        </button>
        <a href="/subjects" class="btn btn-secondary" style="font-size: 22px; padding: 10px 24px;">
          Choose Another Subject &rarr;
        </a>
      </div>
    </div>

    <!-- Question-by-Question Review List -->
    <section style="margin-top: 40px;">
      <h2 style="font-family: var(--font-hand); font-size: 32px; margin-bottom: 20px;">
        Detailed Review &amp; Answer Key
      </h2>

      <div id="review-list">
        <!-- Injected by result.js -->
      </div>

      <!-- Bottom action button -->
      <div style="text-align: center; margin: 40px 0;">
        <a href="/subjects" class="btn btn-primary" style="font-size: 22px; padding: 12px 32px;">
          Back to Notice Board &rarr;
        </a>
      </div>
    </section>
  </main>

  <footer style="text-align: center; padding: 36px 0; font-family: var(--font-hand); font-size: 18px; color: var(--ink-muted);">
    Practice Corner &middot; Honest practice makes confident students
  </footer>

  <script src="/js/auth-nav.js"></script>
  <script src="/js/result.js"></script>
</body>
</html>
