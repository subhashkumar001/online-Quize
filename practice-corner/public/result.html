<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Result — Practice Corner</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- Header -->
  <header class="site-header">
    <div class="container header-content">
      <a href="/subjects" class="logo-area">
        <span class="logo-title">Practice Corner</span>
        <span class="logo-tag">Scorecard</span>
      </a>
      <div id="user-nav-container" class="user-nav">
        <!-- Rendered by auth-nav.js -->
      </div>
    </div>
  </header>

  <main class="container narrow-container">
    <!-- Score Box -->
    <div class="score-badge-card">
      <span id="result-subject-tag" class="logo-tag">
        Subject
      </span>

      <h1 style="font-size: 26px; margin-top: 10px;">
        Quiz Completed
      </h1>

      <div id="score-display" class="score-number">
        0 / 0
      </div>

      <p id="score-message">
        Calculating result...
      </p>

      <div class="score-stats">
        <div class="stat-pill correct">
          ✓ Correct: <span id="correct-count">0</span>
        </div>
        <div class="stat-pill wrong">
          ✗ Incorrect: <span id="wrong-count">0</span>
        </div>
      </div>

      <div style="display: flex; justify-content: center; gap: 12px; margin-top: 24px; flex-wrap: wrap;">
        <button type="button" id="try-again-btn" class="btn btn-primary">
          Try Again
        </button>
        <a href="/subjects" class="btn btn-secondary">
          Choose Another Subject
        </a>
      </div>
    </div>

    <!-- Review Section -->
    <section>
      <h2 style="font-size: 20px; margin-bottom: 16px;">
        Answer Review
      </h2>

      <div id="review-list">
        <!-- Injected by result.js -->
      </div>

      <div style="text-align: center; margin: 32px 0;">
        <a href="/subjects" class="btn btn-primary" style="padding: 10px 24px;">
          Back to Subjects &rarr;
        </a>
      </div>
    </section>
  </main>

  <footer>
    Practice Corner &middot; Student Quiz Portal &middot; 2026
  </footer>

  <script src="/js/auth-nav.js"></script>
  <script src="/js/result.js"></script>
</body>
</html>
